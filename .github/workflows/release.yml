name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的版本标签，例如 v1.0.0"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/domren/jingwei

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "正式版本必须是 v主版本.次版本.修订号，例如 v1.0.0" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
      - name: Pin release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out
          retention-days: 3

  binaries:
    needs: [prepare, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build embedded binary (linux/${{ matrix.arch }})
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "dist/$GOARCH"
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -tags embedui -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o "dist/$GOARCH/jingwei" ./cmd/jingwei
          file "dist/$GOARCH/jingwei"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/jingwei
          retention-days: 3

  docker:
    needs: [prepare, binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jingwei
          POSTGRES_PASSWORD: jingwei-ci-test
          POSTGRES_DB: jingwei
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jingwei -d jingwei"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: jingwei:smoke-${{ matrix.arch }}
          cache-from: type=gha,scope=jingwei-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=jingwei-${{ matrix.arch }}
      - name: Smoke test startup, version and embedded UI
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --entrypoint /app/jingwei "jingwei:smoke-$ARCH" -h
          docker run -d --name jingwei-smoke --network host \
            -e JINGWEI_PG_DSN='postgres://jingwei:jingwei-ci-test@127.0.0.1:5432/jingwei?sslmode=disable' \
            "jingwei:smoke-$ARCH"
          trap 'docker logs jingwei-smoke; docker rm -f jingwei-smoke' EXIT
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 --max-time 3 \
            http://127.0.0.1:8787/api/health > /tmp/health.json
          jq -e --arg version "$VERSION" \
            '.ok == true and .service == "jingwei" and .version == $version' /tmp/health.json
          curl --fail http://127.0.0.1:8787/ | grep -qi '<!doctype html'
      - name: Push tested architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha,scope=jingwei-${{ matrix.arch }}

  docker-publish:
    needs: [prepare, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$TAG" \
            --tag "$IMAGE_NAME:$VERSION" \
            --tag "$IMAGE_NAME:latest" \
            "$IMAGE_NAME:$TAG-amd64" "$IMAGE_NAME:$TAG-arm64"
          docker buildx imagetools inspect "$IMAGE_NAME:$TAG" --raw > /tmp/manifest.json
          platforms=$(jq -r '[.manifests[].platform | select(.os=="linux") | "linux/" + .architecture] | unique | join(", ")' /tmp/manifest.json)
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | index("amd64") != null and index("arm64") != null' /tmp/manifest.json
          digest="sha256:$(sha256sum /tmp/manifest.json | cut -d' ' -f1)"
          {
            echo "$IMAGE_NAME:$TAG"
            echo "$IMAGE_NAME:$VERSION"
            echo "$IMAGE_NAME:latest"
            echo "Digest: $digest"
            echo "Platforms: $platforms"
          } > image-digest.txt
          cat image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
          retention-days: 3

  release:
    needs: [prepare, docker-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: image-digest
          path: .
      - name: Create or update GitHub Release
        run: |
          notes=".github/release-notes/${RELEASE_TAG}.md"
          test -s "$notes"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Jingwei ${RELEASE_TAG}" \
              --notes-file "$notes" \
              --latest
            gh release upload "$RELEASE_TAG" \
              deploy/docker-compose.yml DEPLOY.md image-digest.txt --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "Jingwei ${RELEASE_TAG}" \
              --notes-file "$notes" \
              --latest \
              deploy/docker-compose.yml DEPLOY.md image-digest.txt
          fi
