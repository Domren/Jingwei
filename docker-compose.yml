name: jingwei

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jingwei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jingwei}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jingwei} -d ${POSTGRES_DB:-jingwei}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  jingwei:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${JINGWEI_IMAGE:-jingwei:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JINGWEI_PG_DSN: ${JINGWEI_PG_DSN:-postgres://${POSTGRES_USER:-jingwei}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jingwei}?sslmode=disable}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JINGWEI_LLM_PROVIDER: ${JINGWEI_LLM_PROVIDER:-}
      JINGWEI_LLM_MODEL: ${JINGWEI_LLM_MODEL:-}
      JINGWEI_LLM_BASE_URL: ${JINGWEI_LLM_BASE_URL:-}
      JINGWEI_LLM_PROXY: ${JINGWEI_LLM_PROXY:-}
      JAVA_CHAINS_URL: ${JAVA_CHAINS_URL:-http://java-chains:8011}
      JAVA_CHAINS_PASS: ${JAVA_CHAINS_PASS:-}
      JAVA_CHAINS_MCP_TOKEN: ${JAVA_CHAINS_MCP_TOKEN:-}
      JAVA_CHAINS_CALLBACK_BIND: ${JAVA_CHAINS_CALLBACK_BIND:-127.0.0.1}
      # 侧车容器内部的监听地址：容器有自己的网络命名空间，绑 127.0.0.1 时
      # 宿主机发布的回调端口后面没有人监听，任何目标都回连不上。
      JAVA_CHAINS_LISTEN_BIND: ${JAVA_CHAINS_LISTEN_BIND:-0.0.0.0}
      JAVA_CHAINS_CALLBACK_HOST: ${JAVA_CHAINS_CALLBACK_HOST:-127.0.0.1}
      # 抓包记录诊断：置 1 后每条完成流量都会打一行日志（定位"代理能转发但抓不到包"）
      JINGWEI_TRAFFIC_DEBUG: ${JINGWEI_TRAFFIC_DEBUG:-}
      # 仅本机开发用：置 1 后允许回环来源（如 next dev 的 :3000）携带凭据跨源访问 API。
      # 生产环境不要开——管理 API 一旦对任意站点开口子，同机/同网段的恶意页面就能借会话读数据。
      JINGWEI_DEV_CORS: ${JINGWEI_DEV_CORS:-}
      # ---- 运行时可调项（留空＝用代码内置默认值，行为与不配一致）----
      # 内网隧道的控制端地址：目标可访问的 host:port，裸主机名默认按 chisel 的 8788 处理。
      # 不配它，自动生成 chisel / ssh -R 部署命令这条路整个关着。
      JINGWEI_PIVOT_SERVER: ${JINGWEI_PIVOT_SERVER:-}
      # ssh -R 变体回连控制端用的端口（sshd 常在 22，与 chisel 的 8788 不是一回事）。留空＝22。
      JINGWEI_PIVOT_SSH_PORT: ${JINGWEI_PIVOT_SSH_PORT:-}
      # ssh -R 登录控制端 sshd 用的用户名。留空＝沿用目标侧登录名，两端不同名时 BatchMode
      # 会直接认证失败；填非法值则拒绝生成命令。该侧 sshd 还需 GatewayPorts=clientspecified/yes。
      JINGWEI_PIVOT_SSH_USER: ${JINGWEI_PIVOT_SSH_USER:-}
      # 可选：固定 chisel 控制端的服务端密钥指纹（chisel server 启动日志里的 Fingerprint）。
      # 留空＝不校验；填非法值会直接拒绝生成命令，不会下发一条连不上的 chisel 命令。
      JINGWEI_PIVOT_CHISEL_FINGERPRINT: ${JINGWEI_PIVOT_CHISEL_FINGERPRINT:-}
      # 单次模型调用的总墙钟（含 SDK 重试与流式读取），默认 15m；网关变慢时可调小。
      JINGWEI_LLM_CALL_TIMEOUT: ${JINGWEI_LLM_CALL_TIMEOUT:-}
      # false/0/off 关闭流式输出（默认流式）。
      JINGWEI_LLM_STREAM: ${JINGWEI_LLM_STREAM:-}
      # 范围管控强度：strict（默认，读不到范围就拒绝，失败关闭）/ warn / off。
      JINGWEI_GUARD_ENFORCEMENT: ${JINGWEI_GUARD_ENFORCEMENT:-}
      # 落地物 TTL（小时）：WebShell 与内存马分开控制，未配用内置默认。
      JINGWEI_WEBSHELL_TTL_HOURS: ${JINGWEI_WEBSHELL_TTL_HOURS:-}
      JINGWEI_MEMSHELL_TTL_HOURS: ${JINGWEI_MEMSHELL_TTL_HOURS:-}
      # 侧问（BTW）单次回答的输出上限，256–32768 之外按默认。
      JINGWEI_BTW_MAX_OUTPUT_TOKENS: ${JINGWEI_BTW_MAX_OUTPUT_TOKENS:-}
      # JS 反混淆桥接脚本与 python 解释器路径（镜像内已有默认值时才需要覆盖）。
      JINGWEI_WEBCRACK_BRIDGE: ${JINGWEI_WEBCRACK_BRIDGE:-}
      JINGWEI_WEBCRACK_PYTHON: ${JINGWEI_WEBCRACK_PYTHON:-}
      # 配置文件与 Skill 目录路径覆盖；skills 已挂载到 /app/skills，一般不需要改。
      JINGWEI_CONFIG: ${JINGWEI_CONFIG:-}
      JINGWEI_SKILL_DIR: ${JINGWEI_SKILL_DIR:-}
    ports:
      - "${JINGWEI_WEB_PORT:-9790}:8787"
      - "127.0.0.1:${JINGWEI_PROXY_PORT:-9791}:8788"
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
    restart: unless-stopped

  # 可选的反序列化验证 sidecar。默认不启动：
  #   docker compose --profile java-chains up -d java-chains
  # 不挂载卷，保留镜像内置的 chains-config / 插件；需要持久化时见 deploy/JAVA_CHAINS.md。
  java-chains:
    profiles: ["java-chains"]
    image: ${JAVA_CHAINS_IMAGE:-javachains/javachains:2.0.0-beta7}
    environment:
      CHAINS_AUTH: "true"
      CHAINS_PASS: ${JAVA_CHAINS_PASS:-}
      CHAINS_SHOW_PUBLIC_IP: "false"
    ports:
      - "127.0.0.1:${JAVA_CHAINS_WEB_PORT:-9792}:8011"
      # 这里绑定的是**宿主机**哪个网卡公开回调端口，与侧车内部的监听地址
      # （JAVA_CHAINS_LISTEN_BIND）是两件事。目标在远端时改为 0.0.0.0 或指定网卡，
      # 并把 JAVA_CHAINS_CALLBACK_HOST 设成目标可达的宿主机地址。
      - "${JAVA_CHAINS_CALLBACK_BIND:-127.0.0.1}:58080:58080"
      - "${JAVA_CHAINS_CALLBACK_BIND:-127.0.0.1}:50389:50389"
      - "${JAVA_CHAINS_CALLBACK_BIND:-127.0.0.1}:50388:50388"
      - "${JAVA_CHAINS_CALLBACK_BIND:-127.0.0.1}:13999:13999"
      - "${JAVA_CHAINS_CALLBACK_BIND:-127.0.0.1}:3308:3308"
      - "${JAVA_CHAINS_CALLBACK_BIND:-127.0.0.1}:50000:50000"
      - "${JAVA_CHAINS_CALLBACK_BIND:-127.0.0.1}:11527:11527"
    restart: unless-stopped

volumes:
  pgdata:
